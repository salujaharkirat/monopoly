[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    "monopoly-env/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
